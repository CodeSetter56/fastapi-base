[project]
name = "fastapi-base"
version = "0.1.0"
description = "FastAPI + PostgreSQL starter with JWT auth and SQLModel"
readme = "README.md"
authors = [
    { name = "Ishan", email = "codesetter56@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "bcrypt>=4.2,<6.0",
    "fastapi>=0.115,<1.0",
    "pydantic[email]>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "PyJWT>=2.9,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.48",
    "authlib>=1.2,<2.0",
    "httpx>=0.27,<1.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# FastAPI's dependency injection uses function calls in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Imports follow a sys.path insertion, so they are intentionally after code.
"alembic/env.py" = ["E402", "I001", "RUF100"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"